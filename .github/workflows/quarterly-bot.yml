name: Quarterly Theory Discord Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarterly-theory-discord-bot
  cancel-in-progress: false

jobs:
  send-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BOT_NAME: ${{ vars.BOT_NAME || 'Quarterly Theory' }}
      BOT_AVATAR_URL: ${{ vars.BOT_AVATAR_URL }}
      MENTION_ROLE_ID: ${{ vars.MENTION_ROLE_ID }}
      TIMEFRAMES: ${{ vars.TIMEFRAMES || 'yearly,monthly,weekly,daily,micro' }}
      SHOW_UTC: ${{ vars.SHOW_UTC || 'false' }}
      SNAPSHOT_ON_START: "false"
      MAX_LATE_SECONDS: ${{ vars.MAX_LATE_SECONDS || '21600' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore bot state
        if: github.event_name == 'schedule'
        uses: actions/cache@v4
        with:
          path: .quarterly-bot-state.json
          key: quarterly-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quarterly-bot-state-
      - name: Run bot for five hours
        if: github.event_name == 'schedule'
        run: python quarterly_bot.py --run-for-seconds 18000 --state-file .quarterly-bot-state.json
      - name: Post live snapshot
        if: github.event_name == 'workflow_dispatch'
        run: python quarterly_bot.py --snapshot
