name: Quarterly Theory alerts

# One run stays alive for 5 hours posting every phase shift on time. Just before it
# ends it starts the next run (queued behind it), so the bot is always on.
# watchdog.yml restarts the chain if it ever breaks. To stop the bot, cancel the live run.

on:
  workflow_dispatch: # press "Run workflow" once to start the chain

permissions:
  contents: write # save state.json on the `state` branch
  actions: write # let the run start its own successor

concurrency:
  group: quarterly-bot # only one run is live; the successor waits in the queue
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 345 # hard cap, GitHub's own limit is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load state
        run: |
          if git fetch --depth=1 origin state && git show FETCH_HEAD:state.json > state.json 2>/dev/null; then
            echo "Loaded state: $(cat state.json)"
          else
            echo "No saved state yet (first run)"
            rm -f state.json
          fi

      - name: Run the bot for 5 hours
        env:
          PUSH_STATE: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MENTION_ROLE_ID: ${{ vars.MENTION_ROLE_ID }}
          BOT_AVATAR_URL: ${{ vars.BOT_AVATAR_URL }}
          BOT_NAME: ${{ vars.BOT_NAME || 'Quarterly Theory' }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES || 'yearly,monthly,weekly,daily,micro' }}
          SHOW_UTC: ${{ vars.SHOW_UTC || 'false' }}
          SNAPSHOT_ON_START: ${{ vars.SNAPSHOT_ON_START || 'true' }}
        run: python quarterly_bot.py --serve 300 --state state.json

      - name: Save final state
        if: ${{ !cancelled() }}
        run: bash scripts/save_state.sh state.json

      - name: Start the next 5-hour run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quarterly.yml --ref "${{ github.ref_name }}"
